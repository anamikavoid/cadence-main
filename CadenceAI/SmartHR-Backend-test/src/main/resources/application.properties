spring.application.name=CadenceAI

# Render (and most hosts) tell the app which port to use via the PORT env var.
server.port=${PORT:9090}
server.address=0.0.0.0

# ---- Secrets: NEVER hardcode these. They come from environment variables. ----
# MongoDB connection string (MongoDB Atlas free tier works). No default on purpose:
# the app refuses to start if it is missing instead of silently using a wrong database.
spring.data.mongodb.uri=${MONGODB_URI}

# Secret used to sign login tokens (JWT). Must be at least 32 characters long.
# No default on purpose, for the same reason as above.
jwt.secret=${JWT_SECRET}

# Google Sign-In web client ID. Optional: leave unset to disable Google login.
web.client.id=${GOOGLE_WEB_CLIENT_ID:}

# Supabase storage (profile images). Optional: image upload returns a clear error if unset.
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}

# Optional: this backend's own public /ping URL, to keep a free host awake (see PingScheduler)
keepalive.url=${KEEPALIVE_URL:}

# TRACE logging of Spring Security prints sensitive request details; keep it at INFO.
logging.level.org.springframework.security=INFO

# File size limits for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# WebSocket idle timeout (1 hour)
spring.websocket.timeout=3600000

# ---- Gemini AI assistant (see SETUP_INSTRUCTIONS.md) ----
# API key from Google AI Studio. Never commit it. If unset, /ai/chat answers 503 "not configured".
gemini.api-key=${GEMINI_API_KEY:}
# Model name. Check https://ai.google.dev/gemini-api/docs/models for current names; do NOT use deprecated ones.
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout-ms=30000

# Abuse protection: AI requests allowed per user
ai.rate-limit.per-minute=${AI_RATE_LIMIT_PER_MINUTE:10}
ai.rate-limit.per-day=${AI_RATE_LIMIT_PER_DAY:300}

# Lets Spring create the MongoDB indexes declared on our entities (events, aiConversations incl. the 7-day TTL)
spring.data.mongodb.auto-index-creation=true
